<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniScore Sports API & Target Schema Explorer (10 Môn Thể Thao)</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --green: #238636;
      --red: #da3633;
      --yellow: #d29922;
      --purple: #8957e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    h1 { font-size: 24px; color: var(--text-bright); display: flex; align-items: center; gap: 10px; }
    .badge { font-size: 12px; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
    .badge-live { background: rgba(218, 54, 51, 0.2); color: #f85149; border: 1px solid #f85149; }
    .badge-upcoming { background: rgba(88, 166, 255, 0.2); color: #58a6ff; border: 1px solid #58a6ff; }
    .badge-finished { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid #3fb950; }
    .badge-special { background: rgba(210, 153, 34, 0.2); color: #d29922; border: 1px solid #d29922; }
    
    .sports-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;
      transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .tab-btn:hover { background: #21262d; border-color: #8b949e; }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .control-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .raw-link { color: var(--accent); text-decoration: none; font-size: 14px; }
    .raw-link:hover { text-decoration: underline; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .tour-name { font-size: 13px; color: #8b949e; }
    .tour-meta { font-size: 12px; color: var(--accent); margin-top: 2px; }
    .teams { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
    .team-row { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 600; color: var(--text-bright); }
    .team-info { display: flex; align-items: center; gap: 10px; }
    .team-logo { width: 24px; height: 24px; border-radius: 4px; object-fit: contain; background: #21262d; }
    .team-score { font-size: 18px; font-weight: 700; color: var(--text-bright); min-width: 24px; text-align: right; }

    .details-box { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 12px; font-family: monospace; }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .detail-row:last-child { margin-bottom: 0; }
    .detail-label { color: #8b949e; }
    .detail-val { color: var(--text-bright); font-weight: 500; }

    .btn-view-json {
      background: #21262d; border: 1px solid var(--border); color: var(--accent);
      padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; text-align: center;
      transition: background 0.2s;
    }
    .btn-view-json:hover { background: #30363d; }

    .json-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center;
    }
    .json-modal-content {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
      width: 90%; max-width: 900px; height: 80%; display: flex; flex-direction: column; padding: 20px;
    }
    .json-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .json-modal-header h3 { color: var(--text-bright); }
    .btn-close { background: none; border: none; color: #8b949e; font-size: 20px; cursor: pointer; }
    .btn-close:hover { color: #fff; }
    pre {
      background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 15px;
      overflow: auto; flex: 1; color: #79c0ff; font-family: monospace; font-size: 13px; line-height: 1.4;
    }

    .raw-view-section { margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>⚡ UniScore Real-Time API Explorer</h1>
      <p style="color: #8b949e; font-size: 14px; margin-top: 4px;">Cây dữ liệu 4 tầng chuyên sâu cho 10 môn thể thao (Taxonomy - Entities - Timeline - Center)</p>
    </div>
    <div>
      <span class="badge" style="background: #238636; color: #fff;">v2.0 Production</span>
    </div>
  </header>

  <div class="sports-tabs" id="sportsTabs"></div>

  <div class="control-bar">
    <div id="sportStats" style="font-size: 14px; color: #8b949e;"></div>
    <div>
      <a id="rawJsonLink" class="raw-link" target="_blank" href="#">👉 Mở file JSON gốc trên tab mới</a>
    </div>
  </div>

  <div class="grid" id="matchGrid"></div>

  <div class="raw-view-section">
    <h2 style="font-size: 18px; margin-bottom: 12px; color: var(--text-bright);">📋 Xem trực tiếp JSON Tree của môn hiện tại</h2>
    <pre id="rawPreview">Đang tải dữ liệu...</pre>
  </div>

  <!-- JSON Modal -->
  <div class="json-modal" id="jsonModal">
    <div class="json-modal-content">
      <div class="json-modal-header">
        <h3 id="modalTitle">Chi tiết Cây API Trận Đấu (4 Tầng)</h3>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <pre id="modalJson"></pre>
    </div>
  </div>

  <script>
    const SPORTS = [
      { key: "football", name: "Bóng đá", icon: "⚽" },
      { key: "basketball", name: "Bóng rổ", icon: "🏀" },
      { key: "tennis", name: "Quần vợt", icon: "🎾" },
      { key: "american_football", name: "Bóng bầu dục Mỹ", icon: "🏈" },
      { key: "baseball", name: "Bóng chày", icon: "⚾" },
      { key: "badminton", name: "Cầu lông", icon: "🏸" },
      { key: "volleyball", name: "Bóng chuyền", icon: "🏐" },
      { key: "cricket", name: "Cricket", icon: "🏏" },
      { key: "ice_hockey", name: "Khúc côn cầu trên băng", icon: "🏒" },
      { key: "table_tennis", name: "Bóng bàn", icon: "🏓" },
    ];

    let currentSport = "football";
    let currentData = null;

    function renderTabs() {
      const container = document.getElementById("sportsTabs");
      container.innerHTML = SPORTS.map(s => `
        <button class="tab-btn ${s.key === currentSport ? 'active' : ''}" onclick="selectSport('${s.key}')">
          <span>${s.icon}</span> <span>${s.name}</span>
        </button>
      `).join("");
    }

    async function selectSport(sportKey) {
      currentSport = sportKey;
      renderTabs();
      const dateStr = "2026-11-25";
      const jsonUrl = `./${sportKey}/${dateStr}.json`;
      document.getElementById("rawJsonLink").href = jsonUrl;

      const grid = document.getElementById("matchGrid");
      const preview = document.getElementById("rawPreview");
      grid.innerHTML = "<p style='color: #8b949e;'>Đang tải dữ liệu...</p>";
      preview.innerText = "Đang nạp JSON...";

      try {
        const res = await fetch(jsonUrl);
        if (!res.ok) throw new Error("Chưa có file dữ liệu cho ngày này!");
        currentData = await res.json();
        renderMatches(currentData);
        preview.innerText = JSON.stringify(currentData, null, 2);
      } catch (err) {
        grid.innerHTML = `<p style='color: #f85149;'>Lỗi tải dữ liệu: ${err.message}</p>`;
        preview.innerText = "Không thể tải file JSON.";
      }
    }

    function renderMatches(data) {
      const matches = data.matches || [];
      const statsEl = document.getElementById("sportStats");
      statsEl.innerText = `Tìm thấy ${matches.length} trận đấu được phân tích vào cây 4 tầng`;

      const grid = document.getElementById("matchGrid");
      if (matches.length === 0) {
        grid.innerHTML = "<p style='color: #8b949e;'>Không có trận đấu nào trong danh sách.</p>";
        return;
      }

      grid.innerHTML = matches.map((m, idx) => {
        const tax = m.taxonomy || {};
        const tour = tax.tournament_league || {};
        const ent = m.entities || {};
        const teams = ent.teams_or_players || {};
        const home = teams.home || {};
        const away = teams.away || {};
        const timeline = m.match_timeline || {};
        const scores = timeline.scores || {};
        const stateCat = timeline.state_category || "Upcoming";

        let badgeClass = "badge-upcoming";
        if (stateCat.includes("Live")) badgeClass = "badge-live";
        else if (stateCat.includes("Finished")) badgeClass = "badge-finished";
        else if (stateCat.includes("Special")) badgeClass = "badge-special";

        // Professional extras
        let extraInfo = [];
        if (tour.gender) extraInfo.push(`Giới tính: <b>${tour.gender}</b>`);
        if (tour.age_group) extraInfo.push(`Lứa tuổi: <b>${tour.age_group}</b>`);
        if (tour.stage_type) extraInfo.push(`Giai đoạn: <b>${tour.stage_type}</b> (Lượt ${tour.leg})`);
        if (scores.aggregate_score) extraInfo.push(`Tỷ số tổng 2 lượt: <b>${scores.aggregate_score.home}-${scores.aggregate_score.away}</b>`);
        if (scores.total_points) extraInfo.push(`Tổng điểm môn set: <b>${scores.total_points.home}-${scores.total_points.away}</b>`);
        if (scores.target_score) extraInfo.push(`Điểm mục tiêu Cricket: <b>${scores.target_score}</b>`);

        return `
          <div class="card">
            <div class="card-header">
              <div>
                <div class="tour-name">${tour.name || "Unknown Tournament"}</div>
                <div class="tour-meta">${tax.country_region ? tax.country_region.name : ''} ${tour.round ? '• ' + tour.round : ''}</div>
              </div>
              <span class="badge ${badgeClass}">${stateCat}</span>
            </div>

            <div class="teams">
              <div class="team-row">
                <div class="team-info">
                  ${home.logo_url ? `<img src="${home.logo_url}" class="team-logo" onerror="this.style.display='none'">` : ''}
                  <span>${home.name || "Home Team"}</span>
                </div>
                <div class="team-score">${scores.home_total !== null && scores.home_total !== undefined ? scores.home_total : '-'}</div>
              </div>
              <div class="team-row">
                <div class="team-info">
                  ${away.logo_url ? `<img src="${away.logo_url}" class="team-logo" onerror="this.style.display='none'">` : ''}
                  <span>${away.name || "Away Team"}</span>
                </div>
                <div class="team-score">${scores.away_total !== null && scores.away_total !== undefined ? scores.away_total : '-'}</div>
              </div>
            </div>

            <div class="details-box">
              <div class="detail-row">
                <span class="detail-label">Thời gian bắt đầu:</span>
                <span class="detail-val">${timeline.start_time_iso ? new Date(timeline.start_time_iso).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Chưa rõ'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Đồng hồ thi đấu:</span>
                <span class="detail-val">${timeline.readtime && timeline.readtime.minute ? timeline.readtime.minute : timeline.status_description}</span>
              </div>
              ${extraInfo.map(info => `<div class="detail-row"><span class="detail-label">${info}</span></div>`).join('')}
            </div>

            <button class="btn-view-json" onclick="openModal(${idx})">🔍 Xem Toàn Bộ JSON Cây 4 Tầng Của Trận Này</button>
          </div>
        `;
      }).join("");
    }

    function openModal(idx) {
      if (!currentData || !currentData.matches || !currentData.matches[idx]) return;
      const match = currentData.matches[idx];
      document.getElementById("modalTitle").innerText = `Cây 4 Tầng: ${match.entities.teams_or_players.home.name} vs ${match.entities.teams_or_players.away.name}`;
      document.getElementById("modalJson").innerText = JSON.stringify(match, null, 2);
      document.getElementById("jsonModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("jsonModal").style.display = "none";
    }

    // Init
    renderTabs();
    selectSport("football");
  </script>
</body>
</html>
